name: design-preview

# Baut nur den Zweig "design" zur Ansicht der Oberfläche (kein Docker Hub, keine Geheimnisse nötig).
on:
  push:
    branches:
      - 'design'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  preview-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image-Name in Kleinbuchstaben
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push (nur amd64, schneller)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=design-${{ github.run_number }}
          tags: |
            ${{ steps.img.outputs.name }}:design
            ${{ steps.img.outputs.name }}:design-${{ github.run_number }}
      - name: Zusammenfassung
        run: |
          echo "Image: \`${{ steps.img.outputs.name }}:design\`" >> "$GITHUB_STEP_SUMMARY"
