name: design-preview

# Baut den Zweig "design" und legt das Image in der Container-Registry von Gitea ab.
# Voraussetzungen: Actions aktiv, act_runner mit Label "ubuntu-latest" und Docker-Zugriff,
# Repo-Secret REGISTRY_TOKEN (Zugriffstoken des Nutzers mit Recht "write:package").
on:
  push:
    branches:
      - 'design'
  workflow_dispatch:

jobs:
  preview-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Versionsnummern
        id: ver
        run: |
          # Design: Datum + Laufnummer dieses Builds
          DESIGN="$(date +'%Y.%m.%d').${{ github.run_number }}"
          printf "export const DESIGN_VERSION = '%s';\n" "$DESIGN" > ui/src/app/design-version.ts
          # MeTube: Datum des Original-Stands; master liegt hier nicht im Repo, daher vom GitHub-Fork holen
          git fetch --quiet https://github.com/boxhi/metube.git master:refs/remotes/base/master
          BASE="$(git merge-base base/master HEAD)"
          METUBE="$(git log -1 --format=%cd --date=format:%Y.%m.%d "$BASE")"
          echo "metube=$METUBE" >> "$GITHUB_OUTPUT"
          echo "Design-Version: $DESIGN, MeTube-Stand: $METUBE"
      - name: Registry und Image-Name
        id: img
        run: |
          HOST="${{ github.server_url }}"
          HOST="${HOST#*://}"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "name=${HOST}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login bei der Gitea-Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.img.outputs.host }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build and push (nur amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.metube }}
          tags: |
            ${{ steps.img.outputs.name }}:design
            ${{ steps.img.outputs.name }}:design-${{ github.run_number }}
      - name: Zusammenfassung
        run: echo "Image ${{ steps.img.outputs.name }}:design"
